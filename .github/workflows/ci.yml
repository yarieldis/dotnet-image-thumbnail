name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MinVer derives the version from git tags, so full history is required.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore dotnet-image-thumbnail.sln

      - name: Build
        run: dotnet build dotnet-image-thumbnail.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet-image-thumbnail.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack dotnet-image-thumbnail.sln --configuration Release --no-build --output artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
